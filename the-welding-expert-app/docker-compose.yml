version: '3.8'

services:
  # 1. PostgreSQL Database for Appointment Scheduling
  postgres:
    image: postgres:15-alpine
    container_name: umut-usta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - ./supabase/welding_appointments_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - postgres_umut_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_umut_data:
