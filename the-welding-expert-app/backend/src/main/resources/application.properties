server.port=${PORT:8080}
spring.datasource.url=${BOOKING_DATABASE_URL}
spring.datasource.username=${BOOKING_DATABASE_USER}
spring.datasource.password=${BOOKING_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.read-only=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.security.oauth2.resourceserver.jwt.issuer-uri=${BOOKING_JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${BOOKING_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256,ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
server.error.include-message=never
booking.writes.enabled=${BOOKING_WRITES_ENABLED:false}
booking.writer.url=${BOOKING_WRITER_DATABASE_URL:}
booking.writer.username=${BOOKING_WRITER_DATABASE_USER:}
booking.writer.password=${BOOKING_WRITER_DATABASE_PASSWORD:}
