global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'springboot2026-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['container_blog_backend:5555', 'host.docker.internal:5555']
        labels:
          application: 'springboot2026'

