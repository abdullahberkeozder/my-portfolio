name: Welding App CI

on:
  push:
    paths:
      - "the-welding-expert-app/**"
      - ".github/workflows/welding-app-ci.yml"
  pull_request:
    paths:
      - "the-welding-expert-app/**"
      - ".github/workflows/welding-app-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: the-welding-expert-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: the-welding-expert-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
