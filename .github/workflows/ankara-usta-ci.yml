name: Ankara Usta CI

on:
  pull_request:
    paths:
      - 'ankara-usta-app/**'
      - '.github/workflows/ankara-usta-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ankara-usta-app/**'
      - '.github/workflows/ankara-usta-ci.yml'

permissions:
  contents: read

concurrency:
  group: ankara-usta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ankara-usta-app

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ankara-usta-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit and component tests
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: End-to-end smoke test
        run: npm run test:e2e
