######################################################################################
### TEST PROFILE (IN-MEMORY FAST H2) ##################################################
######################################################################################
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Flyway Migrasyon Ayarları (Test Profili)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Test Cache (In-Memory Simple Cache)
spring.cache.type=simple

# Test Security Credentials
app.security.admin.username=admin
app.security.admin.password=root
app.security.super-admin.username=superadmin
app.security.super-admin.password=root
app.security.swagger-api-csrf-ignore=true

# Test JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=novablog-enterprise-backend
management.health.redis.enabled=false
management.health.mail.enabled=false

# Rate Limiting
app.rate-limit.enabled=true
app.rate-limit.auth.capacity=10
app.rate-limit.auth.duration-seconds=60
app.rate-limit.search.capacity=30
app.rate-limit.search.duration-seconds=60
app.rate-limit.upload.capacity=15
app.rate-limit.upload.duration-seconds=60
app.rate-limit.general.capacity=100
app.rate-limit.general.duration-seconds=60

# Storage Test Profile
storage.type=local

# OAuth2 Social Login Configuration (Test Profile)
spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=dummy-github-client-id
spring.security.oauth2.client.registration.github.client-secret=dummy-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.redirect-uri=http://localhost:3000/oauth2/redirect
app.oauth2.failure-redirect-uri=http://localhost:3000/oauth2/redirect?error=true

# Spring Batch Test Profile
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
app.batch.scheduling.enabled=false

# Spring AI Test Profile (Local Fast Engine)
app.ai.enabled=true
app.ai.provider=LOCAL
app.ai.embedding-dimension=128
app.ai.similarity-threshold=0.50
app.ai.toxicity-threshold=0.65

# Resilience4j Test Profile
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=5
resilience4j.circuitbreaker.instances.aiService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiService.wait-duration-in-open-state=2s
resilience4j.circuitbreaker.instances.aiService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.aiService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.aiService.max-attempts=3
resilience4j.retry.instances.aiService.wait-duration=100ms
resilience4j.retry.instances.aiService.enable-exponential-backoff=false

resilience4j.bulkhead.instances.aiService.max-concurrent-calls=5
resilience4j.bulkhead.instances.aiService.max-wait-duration=100ms

# Concurrency & Write-Behind Metrics Test Profile
app.metrics.flush-rate-ms=60000
app.metrics.initial-delay-ms=60000




