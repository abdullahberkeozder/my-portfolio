# ==============================================================================
# NovaBlog Enterprise Backend - Application Configuration
# Spring Boot 4.1.1 / Java 22 Loom / Distributed Caching & AI Vector Engine
# ==============================================================================

# Server & Profile
server.port=5555
spring.application.name=novablog-enterprise-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Core & Beans
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
server.error.whitelabel.enabled=true

# Jackson JSON
spring.jackson.mapper.default-view-inclusion=true

# Content Negotiation
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.default-content-type=application/json

# Pagination & Web
spring.data.web.pageable.page-parameter=currentPage
spring.data.web.pageable.size-parameter=pageSize
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=1000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
file.upload-dir=upload
file.base-url=http://localhost:5555

# Logging
logging.file.name=./log/blog.log
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.berkeozder=INFO

# Mail Configuration (Mailpit / SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Security & Default Credentials
app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:root}
app.security.super-admin.username=${APP_SECURITY_SUPER_ADMIN_USERNAME:superadmin}
app.security.super-admin.password=${APP_SECURITY_SUPER_ADMIN_PASSWORD:root}
app.security.swagger-api-csrf-ignore=true

# JWT Authentication
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
security.jwt.secret=${app.jwt.secret}
security.jwt.expire-ms=${app.jwt.expiration-ms}

# OpenAPI & Swagger
springdoc.show-actuator=true
springdoc.swagger-ui.persistAuthorization=true

# Actuator & Prometheus
management.server.port=5555
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=springboot2026

info.app.name=NovaBlog Enterprise Backend
info.app.description=High-performance full-stack publishing platform with Spring AI, Redis caching, and Virtual Threads
info.app.version=1.0.0

# Redis & Caching
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
spring.cache.type=redis

# Database & Hibernate
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.hibernate.ddl-auto=create-drop

# Rate Limiting (Token Bucket)
app.rate-limit.enabled=true
app.rate-limit.auth.capacity=10
app.rate-limit.auth.duration-seconds=60
app.rate-limit.search.capacity=30
app.rate-limit.search.duration-seconds=60
app.rate-limit.upload.capacity=15
app.rate-limit.upload.duration-seconds=60
app.rate-limit.general.capacity=100
app.rate-limit.general.duration-seconds=60

# Object Storage (Local / MinIO S3)
storage.type=local
storage.minio.endpoint=http://localhost:9000
storage.minio.access-key=minioadmin
storage.minio.secret-key=minioadmin
storage.minio.bucket-name=blog-bucket
storage.minio.region=us-east-1
storage.minio.presigned-expiry-minutes=60

# OAuth2 Social Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.oauth2.redirect-uri=http://localhost:3000/oauth2/redirect
app.oauth2.failure-redirect-uri=http://localhost:3000/oauth2/redirect?error=true

# Spring Batch ETL
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
app.batch.scheduling.enabled=false
app.batch.cleanup.cron=0 0 2 * * ?
app.batch.analytics.cron=0 0 3 1 * ?

# Spring AI & Vector Search
app.ai.enabled=true
app.ai.provider=LOCAL
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.base-url=https://api.openai.com/v1
app.ai.chat-model=gpt-4o-mini
app.ai.embedding-model=text-embedding-3-small
app.ai.embedding-dimension=128
app.ai.similarity-threshold=0.55
app.ai.toxicity-threshold=0.65

# Resilience4j Circuit Breaker: AI Service
resilience4j.circuitbreaker.instances.aiService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.aiService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiService.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Circuit Breaker: Storage Service
resilience4j.circuitbreaker.instances.storageService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.storageService.sliding-window-size=10
resilience4j.circuitbreaker.instances.storageService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.storageService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.storageService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.storageService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.storageService.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry: AI Service
resilience4j.retry.instances.aiService.max-attempts=3
resilience4j.retry.instances.aiService.wait-duration=500ms
resilience4j.retry.instances.aiService.enable-exponential-backoff=true
resilience4j.retry.instances.aiService.exponential-backoff-multiplier=2

# Resilience4j Bulkhead: AI Service
resilience4j.bulkhead.instances.aiService.max-concurrent-calls=10
resilience4j.bulkhead.instances.aiService.max-wait-duration=500ms

# Concurrency & Write-Behind Engagement Metrics
app.metrics.flush-rate-ms=30000
app.metrics.initial-delay-ms=10000
