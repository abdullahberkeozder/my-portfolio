######################################################################################
### DEV / H2 LOCAL IN-MEMORY PROFILE CONFIGURATION ###################################
######################################################################################

# H2 Dosya/Bellek Tabanlı Bağlantı (Yerel testlerde PostgreSQL gerekmeden anında çalışır)
spring.datasource.url=jdbc:h2:file:./database_memory_persist/blog;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate H2 Eşleme
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cache (Yerel modda Redis sunucusu olmadan in-memory Simple cache kullanılır)
spring.cache.type=simple

# H2 Console Ayarları
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Health Indicators (Yerel modda harici redis ve mail kontrolleri pasif)
management.health.redis.enabled=false
management.health.mail.enabled=false

# Flyway Migrasyon Ayarları (Dev Profili)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
