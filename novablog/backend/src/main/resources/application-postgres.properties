######################################################################################
### POSTGRESQL PRODUCTION / CONTAINER PROFILE CONFIGURATION ##########################
######################################################################################

# Veritabanı Bağlantı Bilgileri (Environment Variables ile ezilebilir)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Ayarları
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Veritabanı Migrasyon Yönetimi
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgresql

# HikariCP Bağlantı Havuzu (Connection Pool)
spring.datasource.hikari.pool-name=SpringBoot2026-HikariCP-PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Redis Önbellek Yapılandırması (Production / Container)
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=3000ms
spring.cache.redis.time-to-live=600000ms
spring.cache.redis.cache-null-values=false

# H2 Console bu profilde kapalıdır
spring.h2.console.enabled=false

# Object Storage Yapılandırması (MinIO / S3 - Production)
storage.type=${STORAGE_TYPE:minio}
storage.minio.endpoint=${STORAGE_MINIO_ENDPOINT:http://minio:9000}
storage.minio.access-key=${STORAGE_MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${STORAGE_MINIO_SECRET_KEY:minioadmin}
storage.minio.bucket-name=${STORAGE_MINIO_BUCKET_NAME:blog-bucket}
