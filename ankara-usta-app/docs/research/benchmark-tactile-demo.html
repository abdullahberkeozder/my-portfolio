<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orkestra Talep Sihirbazı - Beyaz Turuncu Işık Hüzmeli Mikro İlerleme Çubuğu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --brand-green: #0E6F47;
      --brand-green-hover: #0A5335;
      --slate-900: #111827;
      --slate-800: #1F2937;
      --slate-600: #4B5563;
      --slate-500: #6B7280;
      --slate-200: #E5E7EB;
      --slate-100: #F3F4F6;
      --slate-50: #F9FAFB;
      
      /* Beyaz - Turuncu Işık Hüzmesi Renk Paleti */
      --beam-orange-deep: #EA580C;
      --beam-orange: #F97316;
      --beam-orange-light: #FB923C;
      --beam-amber-glow: #FDBA74;
      --beam-white: #FFFFFF;
    }

    body {
      font-family: var(--font-sans);
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* ORKESTRA GERÇEK DİYALOG MİMARİSİ (BEYAZ GLASSMORPHISM) */
    .dialog {
      position: relative;
      width: min(720px, 100%);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-radius: 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 32px 80px -16px rgba(15, 23, 42, 0.28),
        0 8px 24px -4px rgba(15, 23, 42, 0.08),
        0 1px 1px rgba(255, 255, 255, 1) inset;
      overflow: hidden;
      animation: wizardPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes wizardPop {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ══════════════════════════════════════════════════════════════════
       MİKRO İLERLEME ÇUBUĞU (HAIRLINE 3PX) & BEYAZ-TURUNCU IŞIK HÜZMESİ
       ══════════════════════════════════════════════════════════════════ */
    .hairline-progress-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(229, 231, 235, 0.6);
      z-index: 50;
      overflow: hidden;
    }

    .hairline-progress-fill {
      position: relative;
      height: 100%;
      width: 35%; /* Dinamik adım oranı */
      background: linear-gradient(
        90deg, 
        var(--beam-orange-deep) 0%, 
        var(--beam-orange) 50%, 
        var(--beam-orange-light) 100%
      );
      border-radius: 9999px;
      /* Ultra-smooth geçiş fiziği */
      transition: width 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: visible;
    }

    /* Beyaz - Turuncu Işık Hüzmesi (Sheen Sweep) */
    .hairline-progress-fill::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 120px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 10%,
        rgba(255, 255, 255, 0.95) 50%,
        rgba(253, 186, 116, 0.8) 75%,
        transparent 100%
      );
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 10px rgba(249, 115, 22, 0.85));
      animation: lightBeamGlide 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    @keyframes lightBeamGlide {
      0% {
        transform: translateX(-140px);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateX(720px);
        opacity: 0;
      }
    }

    /* Çubuğun Uç Noktasındaki Parlak Işık Noktası (Leading Light Spark) */
    .hairline-lead-glow {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translate(50%, -50%);
      width: 16px;
      height: 6px;
      border-radius: 9999px;
      background: radial-gradient(ellipse at center, #FFFFFF 30%, #FED7AA 65%, transparent 100%);
      box-shadow:
        0 0 6px 1px #FFFFFF,
        0 0 14px 3px rgba(249, 115, 22, 0.95),
        0 0 24px 6px rgba(251, 146, 60, 0.5);
      pointer-events: none;
      animation: leadPulse 2s ease-in-out infinite alternate;
    }

    @keyframes leadPulse {
      0% {
        opacity: 0.85;
        transform: translate(50%, -50%) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translate(50%, -50%) scale(1.15);
      }
    }

    /* ORKESTRA GERÇEK TOPBAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 18px 32px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }

    .service-context {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .service-context span {
      color: var(--brand-green);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .service-context strong {
      font-size: 1.22rem;
      font-weight: 800;
      color: var(--slate-900);
      letter-spacing: -0.03em;
    }

    .close-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--slate-200);
      background: rgba(255, 255, 255, 0.9);
      color: var(--slate-600);
      cursor: pointer;
    }

    /* DİYALOG İÇERİĞİ */
    .form-content {
      max-width: 620px;
      padding: 28px 36px 36px;
      margin: 0 auto;
    }

    /* Mevcut İlerleme Rozeti */
    .stepper-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 10px 18px;
      background: rgba(244, 243, 238, 0.7);
      border: 1px solid rgba(229, 231, 235, 0.85);
      border-radius: 9999px;
      font-size: 0.8125rem;
      color: var(--slate-600);
    }

    .stepper-badge strong {
      color: var(--brand-green);
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .stepper-badge strong::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-green);
      box-shadow: 0 0 8px rgba(14, 111, 71, 0.5);
    }

    .question-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--slate-900);
      margin-bottom: 8px;
    }

    .question-desc {
      font-size: 0.9375rem;
      color: var(--slate-600);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    /* Standart Temiz Seçenek Kartları (Gereksiz AI-slop süslemeleri kaldırıldı) */
    .choice-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }

    .choice-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #FFFFFF;
      border: 1.5px solid #E5E7EB;
      border-radius: 16px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: var(--slate-900);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .choice-item:hover {
      border-color: #D1D5DB;
      background: #F9FAFB;
    }

    .choice-item.selected {
      border-color: var(--brand-green);
      background: #F0FDF4;
      color: var(--brand-green);
    }

    .choice-radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #D1D5DB;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .choice-item.selected .choice-radio {
      border-color: var(--brand-green);
      background: var(--brand-green);
    }

    .choice-item.selected .choice-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
    }

    /* KONTROL BUTONLARI (ADIM GEÇİŞLERİNİ TEST ETMEK İÇİN) */
    .controls-panel {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .step-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.7);
      color: #FFFFFF;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .step-btn:hover {
      background: var(--beam-orange);
      border-color: var(--beam-orange-light);
    }

    .step-btn.active {
      background: var(--beam-orange);
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.5);
    }
  </style>
</head>
<body>

  <!-- ORKESTRA MODAL DİYALOGU -->
  <div class="dialog">
    
    <!-- ════ MİKRO İLERLEME ÇUBUĞU & BEYAZ-TURUNCU IŞIK HÜZMESİ ════ -->
    <div class="hairline-progress-track">
      <div class="hairline-progress-fill" id="progressFill" style="width: 25%;">
        <!-- Uç noktadaki parlak ışık yıldızı -->
        <div class="hairline-lead-glow"></div>
      </div>
    </div>

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="service-context">
        <span>SIHHİ TESİSAT</span>
        <strong>Musluk Tamiri / Değişimi</strong>
      </div>
      <button class="close-btn" aria-label="Kapat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- FORM İÇERİĞİ -->
    <div class="form-content">
      <div class="stepper-badge">
        <strong id="badgeStep">Soru 1 / 3</strong>
        <span id="badgeContext">Kapsam</span>
      </div>

      <h1 class="question-title" id="questionTitle">Hangi batarya için değişim yapılacak?</h1>
      <p class="question-desc" id="questionDesc">Doğru usta ve yedek parça temini için bataryanın montaj alanını seçin.</p>

      <div class="choice-group">
        <div class="choice-item selected" onclick="selectChoice(this)">
          <span>Mutfak Eviye Bataryası</span>
          <div class="choice-radio"></div>
        </div>
        <div class="choice-item" onclick="selectChoice(this)">
          <span>Banyo Lavabo Bataryası</span>
          <div class="choice-radio"></div>
        </div>
        <div class="choice-item" onclick="selectChoice(this)">
          <span>Duş / Banyo Bataryası</span>
          <div class="choice-radio"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ADIM SİMÜLASYONU KONTROLLERİ -->
  <div class="controls-panel">
    <button class="step-btn active" onclick="setStep(1, 25, 'Soru 1 / 3', 'Kapsam', 'Hangi batarya için değişim yapılacak?')">Adım 1: Soru 1 (%25)</button>
    <button class="step-btn" onclick="setStep(2, 50, 'Soru 2 / 3', 'Kapsam', 'Mevcut batarya durumu nedir?')">Adım 2: Soru 2 (%50)</button>
    <button class="step-btn" onclick="setStep(3, 75, 'Adım 2 / 4', 'Fotoğraflar', 'Fotoğraf veya video ekleyin')">Adım 3: Görseller (%75)</button>
    <button class="step-btn" onclick="setStep(4, 100, 'Adım 4 / 4', 'Özet & Onay', 'Talep özetini kontrol edin')">Adım 4: Tamamlandı (%100)</button>
  </div>

  <script>
    function setStep(stepNum, percentage, badgeStep, badgeContext, title) {
      const fill = document.getElementById('progressFill');
      fill.style.width = percentage + '%';

      document.getElementById('badgeStep').textContent = badgeStep;
      document.getElementById('badgeContext').textContent = badgeContext;
      document.getElementById('questionTitle').textContent = title;

      document.querySelectorAll('.step-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === stepNum);
      });
    }

    function selectChoice(el) {
      document.querySelectorAll('.choice-item').forEach(item => item.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>

</body>
</html>
